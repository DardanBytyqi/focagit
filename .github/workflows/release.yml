name: Release

# Pushing a tag like v0.1.0 builds the Linux packages and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    # The oldest runner with webkit2gtk 4.1, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The runners' Azure Ubuntu mirror sometimes hangs, so after one failed try switch to archive.ubuntu.com.
      - name: Install GTK and WebKit
        timeout-minutes: 12
        run: |
          APT="sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=2"
          for i in 1 2 3; do
            timeout 120 $APT update && timeout 300 $APT install -y libgtk-3-dev libwebkit2gtk-4.1-dev && exit 0
            echo "apt attempt $i failed, falling back to archive.ubuntu.com"
            sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) \
              -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} +
          done
          exit 1

      - name: Install Wails and nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0

      - name: Package
        run: make package VERSION=${GITHUB_REF_NAME#v}

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
